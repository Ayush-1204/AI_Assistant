<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aura AI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        /* Base typography settings derived from Geist */
        body {
            font-family: 'Geist', sans-serif;
        }
        
        /* Material Symbols Outline Settings */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Noir Obsidian overrides for this specific page, diverging from default theme for monochromatic look */
        .obsidian-bg {
            background-color: #050505; /* Deep black/charcoal base */
        }
        .obsidian-card {
            background-color: rgba(20, 20, 22, 0.6); /* Slightly lighter charcoal for card */
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .obsidian-input {
            background-color: rgba(10, 10, 12, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f3f4f6; /* Silver-white text */
        }
        .obsidian-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }
        .obsidian-btn-primary {
            background: linear-gradient(180deg, rgba(45, 45, 45, 1) 0%, rgba(20, 20, 20, 1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .obsidian-btn-primary:hover {
            background: linear-gradient(180deg, rgba(60, 60, 60, 1) 0%, rgba(30, 30, 30, 1) 100%);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .obsidian-btn-secondary {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db; /* Lighter silver */
            transition: all 0.2s ease;
        }
        .obsidian-btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .obsidian-text-muted {
            color: #9ca3af;
        }
        .obsidian-tab-active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .obsidian-tab-inactive {
            color: #6b7280;
            border-bottom: 2px solid transparent;
        }
        .obsidian-tab-inactive:hover {
            color: #9ca3af;
        }

        /* Subtle animated background gradient for depth */
        .bg-gradient-obsidian {
            background: radial-gradient(circle at 50% 0%, rgba(35, 35, 40, 0.4) 0%, rgba(5, 5, 5, 1) 70%);
        }

        /* Mouse-tracking Glow Effect */
        .glow-effect {
            position: relative;
            overflow: hidden;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.06), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 0;
        }
        .glow-effect:hover::before {
            opacity: 1;
        }
        .glow-effect.obsidian-btn-primary::before,
        .glow-effect.obsidian-btn-secondary::before {
            background: radial-gradient(200px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.1), transparent 40%);
        }
        /* Ensure content stays above the glow overlay */
        .glow-effect > * {
            position: relative;
            z-index: 1;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "headline-md": ["Geist"],
                        "body-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "label-md": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="obsidian-bg min-h-screen flex items-center justify-center relative overflow-hidden text-gray-200">
<!-- Background Effect -->
<div class="absolute inset-0 bg-gradient-obsidian z-0 pointer-events-none"></div>
<!-- Optional abstract texture overlay -->
<div class="absolute inset-0 opacity-[0.02] mix-blend-overlay z-0 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[440px] px-6 py-12 flex flex-col items-center">
<!-- Brand Header -->
<div class="mb-10 flex flex-col items-center space-y-3">
<div class="w-12 h-12 rounded-xl border border-white/20 bg-white/5 flex items-center justify-center backdrop-blur-md mb-2 shadow-[0_0_20px_rgba(255,255,255,0.05)]">
<!-- Abstract geometric logo representation -->
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="white" stroke-linejoin="round" stroke-width="1.5"></path>
<circle cx="12" cy="12" r="4" stroke="white" stroke-width="1.5"></circle>
</svg>
</div>
<h1 class="font-headline-lg text-headline-lg text-white">Aura AI</h1>
<p class="font-body-md text-body-md obsidian-text-muted">Welcome back to your workspace</p>
</div>
<!-- Glassmorphic Login Card -->
<div class="w-full obsidian-card rounded-2xl p-8 shadow-2xl glow-effect">
<!-- Tabs -->
<div class="flex border-b border-white/10 mb-8">
<button class="flex-1 pb-3 text-center font-label-md text-label-md obsidian-tab-active transition-colors">
                    Log In
                </button>
<button class="flex-1 pb-3 text-center font-label-md text-label-md obsidian-tab-inactive transition-colors">
                    Sign Up
                </button>
</div>
<!-- Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md obsidian-text-muted" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 text-[18px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg obsidian-input font-body-md text-body-md transition-all" id="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md obsidian-text-muted" for="password">Password</label>
<a class="font-label-md text-label-md text-gray-400 hover:text-white transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 text-[18px]">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2.5 rounded-lg obsidian-input font-body-md text-body-md transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-500 hover:text-gray-300 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full py-2.5 rounded-lg font-label-md text-label-md obsidian-btn-primary flex justify-center items-center gap-2 glow-effect" type="submit">
                        Log In
                        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="my-6 flex items-center">
<div class="flex-grow border-t border-white/10"></div>
<span class="mx-4 font-label-md text-label-md obsidian-text-muted">or continue with</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Secondary Auth -->
<button class="w-full py-2.5 rounded-lg font-label-md text-label-md obsidian-btn-secondary flex justify-center items-center gap-3 glow-effect" type="button">
<svg fill="none" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.81 15.7 17.59V20.34H19.27C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#E3E3E3"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.27 20.34L15.7 17.59C14.72 18.25 13.46 18.66 12 18.66C9.17 18.66 6.78 16.75 5.92 14.19H2.24V17.03C4.04 20.61 7.72 23 12 23Z" fill="#E3E3E3"></path>
<path d="M5.92 14.19C5.7 13.53 5.58 12.78 5.58 12C5.58 11.22 5.7 10.47 5.92 9.81V6.97H2.24C1.5 8.44 1.08 10.16 1.08 12C1.08 13.84 1.5 15.56 2.24 17.03L5.92 14.19Z" fill="#E3E3E3"></path>
<path d="M12 5.34C13.62 5.34 15.07 5.9 16.21 6.99L19.35 3.85C17.45 2.08 14.97 1 12 1C7.72 1 4.04 3.39 2.24 6.97L5.92 9.81C6.78 7.25 9.17 5.34 12 5.34Z" fill="#E3E3E3"></path>
</svg>
                Google
            </button>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-label-md text-label-md obsidian-text-muted">
                By logging in, you agree to our <a class="text-gray-300 hover:text-white underline decoration-white/30 underline-offset-2" href="#">Terms of Service</a> and <a class="text-gray-300 hover:text-white underline decoration-white/30 underline-offset-2" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.glow-effect').forEach(el => {
            el.addEventListener('mousemove', e => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                el.style.setProperty('--mouse-x', `${x}px`);
                el.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    });
</script>
</body></html>
